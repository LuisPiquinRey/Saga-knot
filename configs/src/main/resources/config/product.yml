server:
  port: 8071
spring:
  config:
    import:
      - "product_test.yml"
      - "product_prod.yml"
  logging:
    file:
      name: logs/product.log
    logback:
      rollingpolicy:
        clean-history-on-start: true
        max-file-size: 100MB
    charset:
      console: UTF-8
      file: UTF-8
eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: "http://localhost:8761/eureka"
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  metrics:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS
      show-components: ALWAYS
otel:
  traces:
    exporter: otlp
  exporter:
    otlp:
      endpoint: http://localhost:4318
  resource:
    attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${spring.profiles.active:dev}
  logs:
    exporter: none
axon:
  metrics:
    enabled: true
  axonserver:
    servers: localhost:8125
axoniq:
  console:
    application-name: Shopping-axion
    credentials: ${CREDENTIALS_AXION}
    dlq-mode: FULL